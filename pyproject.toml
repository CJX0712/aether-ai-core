[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-ai-core"
version = "0.1.0"
description = "Aether AI Core - 模块化端到端 AI 系统框架（RAG + Agent）"
authors = [{ name = "晨星" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy==2.5.3",
    "faiss-cpu==1.15.1",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "typer==0.27.2",
    "httpx==0.28.1",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
embed = ["sentence-transformers>=3.0.0", "torch>=2.2.0"]
local-llm = ["llama-cpp-python>=0.2.90"]
docs = ["pdfplumber>=0.11.0", "python-docx>=1.1.0"]

[project.scripts]
aether = "aether.cli:app"

[tool.setuptools.packages.find]
include = ["aether*"]

[tool.setuptools.package-data]
aether = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
